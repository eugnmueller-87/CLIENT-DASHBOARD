metrics:
  global:
    scrape_interval: 30s
    external_labels:
      host: ${CLIENT_LABEL}

  configs:
    - name: default
      scrape_configs:

        # ── Node / infrastructure ──────────────────────────────────────────
        - job_name: node
          static_configs:
            - targets: ["localhost:9100"]
              labels:
                client: ${CLIENT_LABEL}

        # ── HTTP uptime (blackbox) ─────────────────────────────────────────
        # Add each client app URL below. Blackbox probes the URL and exposes
        # probe_success (1 = up, 0 = down) and probe_duration_seconds.
        - job_name: blackbox_http
          metrics_path: /probe
          params:
            module: [http_2xx]
          static_configs:
            - targets:
                # Add client app URLs here, e.g.:
                # - https://metabelly.com/health
                # - https://client-b.com/health
          relabel_configs:
            - source_labels: [__address__]
              target_label: __param_target
            - source_labels: [__param_target]
              target_label: instance
            - target_label: __address__
              replacement: localhost:9115

        # ── App custom metrics (request volume, API cost, token consumption) ──
        # Each client app must expose a /metrics endpoint (Prometheus format).
        # Duplicate this block per client, changing target and CLIENT_LABEL.
        #
        # Required counters the app must expose for cost/tier tracking:
        #
        #   api_tokens_used_total{client, provider, token_type, model}
        #     - client:     matches CLIENT_LABEL (e.g. "metabelly")
        #     - provider:   "anthropic" | "openai" | "openai-mini"
        #     - token_type: "input" | "output"
        #     - model:      e.g. "claude-sonnet-4-6", "gpt-4o"
        #
        #   http_requests_total{client, handler, status}   (for request rate panel)
        #
        # Python example (prometheus_client library):
        #   from prometheus_client import Counter
        #   TOKENS = Counter(
        #     "api_tokens_used_total", "LLM token consumption",
        #     ["client", "provider", "token_type", "model"]
        #   )
        #   # After each API call:
        #   TOKENS.labels(client="metabelly", provider="anthropic",
        #                 token_type="input",  model="claude-sonnet-4-6").inc(usage.input_tokens)
        #   TOKENS.labels(client="metabelly", provider="anthropic",
        #                 token_type="output", model="claude-sonnet-4-6").inc(usage.output_tokens)
        - job_name: app_metrics
          static_configs:
            - targets: ["localhost:8000"]
              labels:
                client: metabelly

      remote_write:
        - url: ${GRAFANA_CLOUD_URL}
          basic_auth:
            username: ${GRAFANA_CLOUD_USER}
            password: ${GRAFANA_CLOUD_API_KEY}
          queue_config:
            max_samples_per_send: 1000
            max_shards: 5
